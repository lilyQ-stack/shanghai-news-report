name: Kankanews News Report Collector

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Program date (YYYY-MM-DD); leave blank for yesterday in Asia/Shanghai'
        required: false
        type: string
  schedule:
    - cron: '30 13 * * *'  # 21:30 Asia/Shanghai, same-day episode
    - cron: '30 22 * * *'  # 06:30 Asia/Shanghai
    - cron: '15 0 * * *'   # 08:15 Asia/Shanghai, retry
    - cron: '45 1 * * *'   # 09:45 Asia/Shanghai, retry
  push:
    paths:
      - 'news-report/fetch_kankanews.py'
      - 'news-report/requirements.txt'
      - '.github/workflows/kankanews-news-report.yml'

permissions:
  contents: write

# Prevent simultaneous scheduled/manual runs from racing to push main.
concurrency:
  group: kankanews-news-report-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r news-report/requirements.txt
      - name: Resolve program date
        id: target
        env:
          INPUT_DATE: ${{ github.event.inputs.date }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -n "$INPUT_DATE" ]; then
            TARGET_DATE="$INPUT_DATE"
          elif [ "$SCHEDULE" = "30 13 * * *" ] && [ "$(TZ=Asia/Shanghai date +%H)" -ge 19 ]; then
            TARGET_DATE="$(TZ=Asia/Shanghai date +%F)"
          else
            TARGET_DATE="$(TZ=Asia/Shanghai date -d yesterday +%F)"
          fi
          echo "Program date: $TARGET_DATE"
          echo "date=$TARGET_DATE" >> "$GITHUB_OUTPUT"
      - name: Collect program page
        env:
          TARGET_DATE: ${{ steps.target.outputs.date }}
        run: python news-report/fetch_kankanews.py --date "$TARGET_DATE"
      - name: Commit collected data and diagnostics
        run: |
          if [ -z "$(git status --porcelain -- news-report/data)" ]; then
            echo "No data changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news-report/data
          git commit -m "Update Kankanews News Report data"
          # Another job may have pushed since checkout; rebase and retry safely.
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another run (attempt $attempt); retrying."
            sleep 3
          done
          echo "Could not push collected news data" >&2
          exit 1


      - name: Validate collected program data
        env:
          TARGET_DATE: ${{ steps.target.outputs.date }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          date = os.environ["TARGET_DATE"]
          path = Path("news-report/data") / f"{date}.json"
          if not path.exists():
              raise SystemExit(f"Missing program data: {path}")
          data = json.loads(path.read_text(encoding="utf-8"))
          items = data.get("items", [])
          valid = (data.get("date") == date and data.get("program") == "新闻报道"
                   and data.get("program_id") == "7LMwVLeyzn3" and data.get("status") == "ok"
                   and len(items) >= 2 and items[0].get("order") == 1
                   and date.replace("-", "") in items[0].get("title", "")
                   and all(item.get("order") == i + 1 for i, item in enumerate(items)))
          if not valid:
              raise SystemExit(f"Incomplete or invalid program data: {path}")
          print(f"Validated {date}: {len(items)} items")
          PY

