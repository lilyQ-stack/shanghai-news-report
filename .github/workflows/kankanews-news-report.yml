name: Kankanews News Report Collector

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Program date (YYYY-MM-DD); leave blank for yesterday in Asia/Shanghai'
        required: false
        type: string
  schedule:
    - cron: '30 22 * * *'  # 06:30 Asia/Shanghai
    - cron: '15 0 * * *'   # 08:15 Asia/Shanghai, retry
    - cron: '45 1 * * *'   # 09:45 Asia/Shanghai, retry
  push:
    paths:
      - 'news-report/fetch_kankanews.py'
      - 'news-report/requirements.txt'
      - '.github/workflows/kankanews-news-report.yml'

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r news-report/requirements.txt
      - name: Collect program page
        env:
          INPUT_DATE: ${{ github.event.inputs.date }}
        run: |
          if [ -n "$INPUT_DATE" ]; then
            python news-report/fetch_kankanews.py --date "$INPUT_DATE"
          else
            python news-report/fetch_kankanews.py
          fi
      - name: Validate collected program data
        env:
          INPUT_DATE: ${{ github.event.inputs.date }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          date = os.environ.get("INPUT_DATE") or (datetime.now(timezone(timedelta(hours=8))).date() - timedelta(days=1)).isoformat()
          path = Path("news-report/data") / f"{date}.json"
          if not path.exists():
              raise SystemExit(f"Missing program data: {path}")
          data = json.loads(path.read_text(encoding="utf-8"))
          items = data.get("items", [])
          valid = (data.get("date") == date and data.get("program") == "新闻报道"
                   and data.get("program_id") == "7LMwVLeyzn3" and data.get("status") == "ok"
                   and len(items) >= 2 and items[0].get("order") == 1
                   and date.replace("-", "") in items[0].get("title", "")
                   and all(item.get("order") == i + 1 for i, item in enumerate(items)))
          if not valid:
              raise SystemExit(f"Incomplete or invalid program data: {path}")
          print(f"Validated {date}: {len(items)} items")
          PY

      - name: Commit collected data
        run: |
          if [ -z "$(git status --porcelain -- news-report/data)" ]; then
            echo "No data changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news-report/data
          git commit -m "Update Kankanews News Report data"
          git push

